seed: 42
output_dir: outputs/week1_mre
data:
  name: synthetic
  n_train: 2048
  n_val: 512
  latent_dim: 16
  action_dim: 4
  noise_std: 0.03
  hard_noise_multiplier: 8.0
  unreliable_prob: 0.25
  mismatch_prob: 0.15
model:
  latent_dim: 16
  action_dim: 4
  hidden_dim: 128
  predictor_layers: 3
  reliability_hidden_dim: 128
  dropout: 0.05
training:
  epochs: 50
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  prediction_loss_weight: 1.0
  reliability_loss_weight: 0.25
eval:
  retrieval_ks: [1, 5, 10]
  selector_thresholds: [0.05, 0.1, 0.2, 0.35, 0.5, 0.65, 0.8, 0.9]
  cheap_compute: 1.0
  optional_compute: 3.0
  utility_scale: 1.0
