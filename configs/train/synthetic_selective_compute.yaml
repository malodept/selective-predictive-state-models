seed: 42
output_dir: outputs/synthetic_selective_compute
data:
  name: synthetic
  n_train: 1024
  n_val: 512
  latent_dim: 16
  action_dim: 4
  noise_std: 0.03
  hard_noise_multiplier: 8.0
  unreliable_prob: 0.25
  mismatch_prob: 0.15
model:
  latent_dim: 16
  action_dim: 4
  hidden_dim: 96
  predictor_layers: 3
  reliability_hidden_dim: 96
  dropout: 0.05
training:
  epochs: 35
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  prediction_loss_weight: 1.0
  reliability_loss_weight: 1.0
  reliability_pos_weight: 3.0
eval:
  retrieval_ks: [1, 5, 10]
  selector_thresholds: [0.05, 0.1, 0.2, 0.35, 0.5, 0.65, 0.8, 0.9]
  cheap_compute: 1.0
  optional_compute: 3.0
  utility_scale: 1.0
  compute_penalty: 0.25
  hard_refinement_factor: 0.20
  easy_refinement_factor: 0.95
